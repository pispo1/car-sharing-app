<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MegaKotxea App</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="env.js"></script>
    <style>
      :root {
        --accent: #2c6b60;
        --accent-hover: #dceae3;
        --surface-soft: #edf3ee;
        --success: #67917a;
        --ink: #253b35;
        --paper: #f8f7f3;
        --muted: #57655e;
        --line: #dfe7de;
        --highlight: #f0f5e9;
      }
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: var(--paper);
        color: var(--ink);
      }
      h1 {
        font-size: 20px;
        text-align: center;
        background-color: var(--surface-soft);
        color: var(--accent);
        border-bottom: 1px solid var(--line);
        padding: 14px 10px;
      }
      #mainScreen {
        display: none;
      }
      #loginForm,
      #mainScreen,
      #resetPasswordForm,
      #resetForm {
        max-width: 480px;
        margin: 20px auto;
        background: #fff;
        padding: 20px;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
      input,
      button {
        padding: 8px;
        margin: 5px;
        border: 1px solid var(--line);
      }
      button {
        background-color: var(--surface-soft);
        color: var(--accent);
        border: 1px solid var(--line);
        cursor: pointer;
        padding: 8px; /* Compact padding */
        font-size: 12px; /* Slightly smaller font for a compact look */
      }

      a { color: var(--accent); text-underline-offset: 3px; }
      #weekPickerContainer button { background: var(--surface-soft); color: var(--ink); }
      #weekPickerContainer button:hover { background: var(--accent-hover); }
      button:hover {
        background-color: var(--accent-hover);
      }
      #loading {
        display: none;
        text-align: center;
      }
      #errorMsg {
        color: red;
      }
      #tripsContainer,
      #statsContainer,
      #weekPickerContainer {
        margin: 20px;
      }
      .trip-item {
        margin: 10px 0;
      }
      .trip-item button {
        margin-left: 10px;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      li {
        font-size: 12px;
        background: white;
        padding: 0;
        margin: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .trip-actions {
        display: flex;
        gap: 5px;
      }
      #statsContainer table {
        width: 100%;
        max-width: 600px;
        margin: auto;
        border-collapse: collapse;
        background: white;
        font-size: 14px;
      }
      th,
      td {
        font-size: 12px;
        border: 1px solid var(--line);
        padding: 8px;
        text-align: center;
      }
      th {
        background-color: var(--highlight);
        color: var(--ink);
        font-weight: 600;
      }
      #errorMsg {
        color: red;
        margin-top: 10px;
      }
      #logout {
        background-color: var(--surface-soft);
        color: var(--ink);
        padding: 8px 15px;
        border: none;
        cursor: pointer;
        width: auto;
        margin: 10px 0;
      }
      #logout:hover {
        background-color: var(--accent-hover);
      }
      .dateHeader {
        margin: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .companyHeader {
        font-size: 12px;
        margin: 8px 0 4px;
        padding: 6px;
      }
      .pastDay > summary {
        cursor: pointer;
      }
      .pastDay > summary > .dateHeader {
        display: inline-flex;
        margin: 8px 0;
      }
      .tripActions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }
      #weekPickerContainer {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      * { box-sizing: border-box; }
      button, input { font: inherit; border-radius: 6px; min-height: 44px; }
      button { font-size: 13px; margin: 0; }
      button:disabled { opacity: .6; cursor: wait; }
      :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
      #mainScreen { padding: 16px; }
      #tripsContainer, #statsContainer, #weekPickerContainer { margin: 0; }
      #weekPickerContainer { gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
      #weekPicker { flex: 1; min-width: 150px; margin: 0; }
      #logout { margin: 0; padding: 8px; }
      #errorMsg { max-width: 480px; margin: 8px auto; padding: 0 16px; }
      #saveStatus { font-size: 13px; color: var(--muted); }
      #saveStatus:empty { display: none; }
      .dateHeader {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px 12px;
        margin-top: 24px;
        padding: 12px 8px;
        border-top: 1px solid var(--line);
        border-left: 3px solid transparent;
        border-radius: 0 6px 6px 0;
        font-size: 14px;
        line-height: 1.5;
        color: var(--ink);
      }
      .dateHeader.highlight-driver-not-needed { border-left-color: var(--success); }
      .dateHeader.highlight-driver-needed {
        border-left-color: #b15b50;
        color: #8e3e36;
        background: #fbefeb;
      }
      .dateHeader.emptyDay { border-left-color: transparent; color: var(--muted); }
      .dateHeader.today { border-top-color: var(--success); }
      .dateHeader .tripActions { justify-content: flex-end; gap: 6px; align-self: start; }
      .dateHeader .tripActions button, #weekPickerContainer button { min-width: 44px; }
      .dateHeader a { grid-column: 1 / -1; color: inherit; font-size: 12px; font-weight: normal; text-underline-offset: 3px; }
      .companyHeader { margin: 12px 0 2px; padding: 6px 8px; color: var(--muted); font-size: 12px; font-weight: 600; }
      li { font-size: 14px; line-height: 1.5; padding: 6px 8px; gap: 8px; overflow-wrap: anywhere; border-bottom: 1px solid var(--line); }
      li .tripActions { flex-shrink: 0; gap: 4px; }
      li .tripActions button { min-width: 44px; background: var(--surface-soft); color: var(--accent); }
      li .tripActions button:hover { background: var(--accent-hover); }
      .ownTrip { color: var(--ink); font-weight: 600; }
      li.ownTrip, tr.ownTrip { background: var(--highlight); }
      li.ownTrip { border-radius: 6px; }
      .pastDay { margin-top: 20px; border-top: 1px solid var(--line); }
      .pastDay > summary { color: var(--muted); }
      .pastDay > summary > .dateHeader {
        display: inline-grid;
        width: calc(100% - 24px);
        margin: 0;
        border: 0;
        background: transparent;
        color: var(--muted);
        font-weight: normal;
      }
      .pastDay li { color: var(--muted); }
      #tripsContainer[inert] { opacity: .65; }
      #statsContainer { margin-top: 28px; scroll-margin-top: 16px; }
      #statsContainer h2 { font-size: 17px; margin-bottom: 6px; }
      .hint { font-size: 12px; line-height: 1.5; color: var(--muted); }
      #userStats { overflow-x: auto; }
      @media (max-width: 520px) {
        #mainScreen { margin: 8px; }
        #loginForm, #resetPasswordForm, #resetForm { margin: 8px; }
        th, td { padding: 6px; }
      }
    </style>
  </head>
  <body>
    <h1>MegaKotxea</h1>

    <div id="loginForm">
      <input type="email" id="email" placeholder="Email" aria-label="Email" autocomplete="username" />
      <input type="password" id="password" placeholder="Contraseña" aria-label="Contraseña" autocomplete="current-password" />
      <button id="login">Iniciar</button>
      <p>
        <a href="javascript:void(0);" id="forgotPasswordLink"
          >Forgot your password?</a
        >
      </p>
    </div>

    <div id="resetPasswordForm" style="display: none">
      <input type="email" id="resetEmail" placeholder="Enter your email" />
      <button id="resetPasswordBtn">Reset Password</button>
      <button id="cancelResetBtn">Cancel</button>
      <p id="resetErrorMsg" style="color: red"></p>
    </div>

    <div id="resetForm" style="display: none">
      <input
        type="password"
        id="newPassword"
        placeholder="New Password"
        required
      />
      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm Password"
        required
      />
      <button id="resetPasswordButton">Reset Password</button>
      <p id="errorMessage" style="color: red; display: none"></p>
    </div>

    <p id="errorMsg" role="alert"></p>

    <div id="mainScreen">
      <div id="weekPickerContainer">
        <input type="week" id="weekPicker" aria-label="Semana del plan" />
        <button id="csv" title="Descargar todos los viajes en CSV" aria-label="Descargar todos los viajes en CSV">⬇️</button>
        <button id="logout" title="Cerrar sesión" aria-label="Cerrar sesión">🚪</button>
      </div>

      <div id="loading" role="status">Cargando viajes...</div>
      <p id="saveStatus" role="status" aria-live="polite"></p>
      <div id="tripsContainer"></div>
      <div id="statsContainer">
        <h2>Turno para conducir</h2>
        <p class="hint">Menor ratio total primero: viajes como conductor / viajes reservados.
          El total incluye futuras reservas; el consolidado cuenta hasta ayer.</p>
        <div id="userStats"></div>
      </div>
    </div>

    <script>
      let access_token = null;
      let refresh_token = null;

      if (window.location.pathname.startsWith("/update-password")) {
        document.getElementById("resetForm").style.display = "block";
        document.getElementById("loginForm").style.display = "none";
        const hash = window.location.hash;
        const params = new URLSearchParams(hash.substring(1)); // Remove the '#' character
        access_token = params.get("access_token");
        refresh_token = params.get("refresh_token");
      }

      console.log("Using Supabase URL:", supabaseUrl);

      const supabasecli = supabase.createClient(supabaseUrl, supabaseKey);

      let USER = null;

      function showPrompt(iniContent, callback) {
        // Create the modal background
        const modal = document.createElement("div");
        modal.style.position = "fixed";
        modal.style.top = "0";
        modal.style.left = "0";
        modal.style.width = "100%";
        modal.style.height = "100%";
        modal.style.backgroundColor = "rgba(0, 0, 0, 0.5)";
        modal.style.display = "flex";
        modal.style.justifyContent = "center";
        modal.style.alignItems = "center";
        modal.style.zIndex = "1000";

        // Create the prompt box
        const promptBox = document.createElement("div");
        promptBox.style.background = "white";
        promptBox.style.padding = "20px";
        promptBox.style.borderRadius = "10px";
        promptBox.style.boxShadow = "0px 4px 6px rgba(0, 0, 0, 0.1)";
        promptBox.style.textAlign = "center";

        // Create the input field
        const input = document.createElement("input");
        input.type = "text";
        input.value = iniContent;
        input.placeholder = "Enter your notes";
        input.style.width = "80%";
        input.style.padding = "8px";
        input.style.marginBottom = "10px";

        // Create the buttons
        const confirmButton = document.createElement("button");
        confirmButton.textContent = "OK";
        confirmButton.style.marginRight = "10px";
        confirmButton.onclick = () => {
          callback(input.value); // Pass input value to callback
          document.body.removeChild(modal);
        };

        const cancelButton = document.createElement("button");
        cancelButton.textContent = "Cancel";
        cancelButton.onclick = () => {
          document.body.removeChild(modal);
        };

        // Append elements
        promptBox.appendChild(input);
        promptBox.appendChild(document.createElement("br"));
        promptBox.appendChild(confirmButton);
        promptBox.appendChild(cancelButton);
        modal.appendChild(promptBox);
        document.body.appendChild(modal);

        // Focus input field
        input.focus();
      }

      function showError(msg) {
        document.getElementById("errorMsg").textContent = msg;
      }

      function clearError() {
        document.getElementById("errorMsg").textContent = "";
      }

      async function login() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const { data, error } = await supabasecli.auth.signInWithPassword({
          email,
          password,
        });

        if (error) {
          console.error("Login Error:", error.message);
          showError(error.message);
        } else {
          USER = data.user;
          toggleUI(true);
          clearError();
        }
      }

      async function logout() {
        const { error } = await supabasecli.auth.signOut();
        if (error) {
          console.error("Logout Error:", error.message);
        } else {
          toggleUI(false);
        }
      }

      function toggleUI(loggedIn) {
        document.getElementById("loginForm").style.display = loggedIn
          ? "none"
          : "block";
        document.getElementById("mainScreen").style.display = loggedIn
          ? "block"
          : "none";

        if (loggedIn) {
          setCurrentWeek();
          fetchTrips();
          fetchTripsStats();
        }
      }

      function getWeekRange(weekStr) {
        const [year, week] = weekStr.split("-W");
        const firstDayOfYear = new Date(Date.UTC(year, 0, 1));
        let dayOfWeek = firstDayOfYear.getUTCDay();
        let daysToAdd = dayOfWeek <= 1 ? 1 - dayOfWeek : 8 - dayOfWeek;
        firstDayOfYear.setUTCDate(firstDayOfYear.getUTCDate() + daysToAdd);

        const startOfWeek = new Date(firstDayOfYear);
        startOfWeek.setUTCDate(
          firstDayOfYear.getUTCDate() + (parseInt(week) - 2) * 7
        );

        const endOfWeek = new Date(startOfWeek);
        endOfWeek.setUTCDate(startOfWeek.getUTCDate() + 6);

        return {
          start: startOfWeek.toISOString().split("T")[0],
          end: endOfWeek.toISOString().split("T")[0],
        };
      }

      function setCurrentWeek() {
        const today = new Date();
        const referenceDate = new Date(today);
        const day = today.getDay();
        referenceDate.setDate(today.getDate() + (day === 6 ? 2 : day === 0 ? 1 : 0));
        const year = referenceDate.getFullYear();
        const week = getWeekNumber(referenceDate);
        document.getElementById("weekPicker").value = `${year}-W${String(week).padStart(2, '0')}`;
      }

      function getWeekNumber(date) {
        const startOfYear = new Date(date.getFullYear(), 0, 1);
        return Math.ceil((((date - startOfYear) / 86400000) + startOfYear.getDay() + 1) / 7);
      }

      function saveCSV(csvData) {
        const blob = new Blob([csvData], { type: "text/csv" });

        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "trips.csv";

        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);
      }

      async function generateCSV() {
        const { data, error } = await supabasecli.functions.invoke(
          `trips?csv=true`,
          {
            method: "GET",
          }
        );

        if (error) {
          console.error("Error downloading trips:", error.message);
          showError("Error downloading trips");
        } else {
          saveCSV(data);
        }
      }

      let tripsRequest = 0;
      let statsRequest = 0;
      let renderedWeek = null;
      let tripsLoading = false;

      async function fetchTrips() {
        const weekStr = document.getElementById("weekPicker").value;
        const request = ++tripsRequest;
        const loading = document.getElementById("loading");
        const container = document.getElementById("tripsContainer");
        if (!weekStr) {
          loading.style.display = "none";
          tripsLoading = false;
          container.inert = savingTrip;
          return;
        }
        loading.style.display = "block";
        tripsLoading = true;
        container.inert = true;
        if (renderedWeek !== weekStr) {
          while (container.firstChild) container.removeChild(container.firstChild);
        }
        try {
          const { start, end } = getWeekRange(weekStr);
          const { data, error } = await supabasecli.functions.invoke(
            `trips?start=${start}&end=${end}`, { method: "GET" }
          );
          if (request !== tripsRequest) return;
          if (error) throw error;
          displayTrips(data.trips);
          renderedWeek = weekStr;
        } catch (error) {
          if (request === tripsRequest) showError("No se pudo cargar el plan. Vuelve a seleccionar la semana para reintentar.");
        } finally {
          if (request === tripsRequest) {
            loading.style.display = "none";
            tripsLoading = false;
            container.inert = savingTrip;
          }
        }
      }

      async function fetchTripsStats() {
        const request = ++statsRequest;
        try {
          const { data, error } = await supabasecli.functions.invoke(
            "trips?stats=true", { method: "GET" }
          );
          if (request !== statsRequest) return;
          if (error) throw error;
          displayStats(data.stats);
        } catch (error) {
          if (request === statsRequest) showError("No se pudo actualizar el turno para conducir. Recarga para reintentar.");
        }
      }

      function displayStats(stats) {
        const container = document.getElementById("userStats");

        while (container.firstChild) {
          container.removeChild(container.firstChild);
        }
        const table = document.createElement("table");
        table.setAttribute("border", "1");

        const thead = document.createElement("thead");
        const headerRow = document.createElement("tr");
        const headers = ["Orden · Usuario", "Ratio Total", "Hasta ayer"];

        headers.forEach((headerText) => {
          const th = document.createElement("th");
          th.textContent = headerText;
          th.scope = "col";
          headerRow.appendChild(th);
        });

        thead.appendChild(headerRow);
        table.appendChild(thead);

        const tbody = document.createElement("tbody");

        const orderedStats = [...stats].sort((a, b) => {
          if (a.email === null) return 1;
          if (b.email === null) return -1;
          return a.driver_ratio - b.driver_ratio;
        });
        orderedStats.forEach((stat, index) => {
          const row = document.createElement("tr");

          const emailCell = document.createElement("td");
          emailCell.textContent =
            (stat.email === null ? "" : `${index + 1}. `) +
            stat.first_name + (stat.last_name ? " " + stat.last_name : "");
          if (stat.email === USER?.email) row.className = "ownTrip";
          row.appendChild(emailCell);

          const totalRatioCell = document.createElement("td");
          totalRatioCell.textContent = `${stat.driver_ratio.toFixed(2)} (${
            stat.driver_trips
          }/${stat.passenger_trips + stat.driver_trips})`;
          row.appendChild(totalRatioCell);

          const consolidatedRatioCell = document.createElement("td");
          consolidatedRatioCell.textContent = `${stat.driver_ratio_until_today.toFixed(
            2
          )}  (${stat.driver_trips_until_today}/${
            stat.passenger_trips_until_today + stat.driver_trips_until_today
          })`;
          row.appendChild(consolidatedRatioCell);

          tbody.appendChild(row);
        });

        table.appendChild(tbody);

        container.appendChild(table);
      }

      function groupTripsByDate(trips) {
        const groupedTrips = {};

        trips.forEach((trip) => {
          const date = trip.trip_date;
          if (!groupedTrips[date]) {
            groupedTrips[date] = [];
          }
          groupedTrips[date].push(trip);
        });

        return groupedTrips;
      }

      function groupTripsByCompany(trips) {
        const groups = new Map();
        trips.forEach((trip) => {
          const company = trip.profiles.company?.trim() || "";
          if (!groups.has(company)) groups.set(company, []);
          groups.get(company).push(trip);
        });
        return [...groups.entries()].sort(([a], [b]) => {
          if (!a) return 1;
          if (!b) return -1;
          return a.localeCompare(b, "es");
        });
      }

      function getCurrentDateInMadrid() {
        const currentDate = new Date().toLocaleString("en-GB", {
          timeZone: "Europe/Madrid",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
        });

        const [day, month, year] = currentDate.split("/");
        return `${year}-${month}-${day}`;
      }

      function capacityLabel(people, seats) {
        if (!people) return "Sin reservas";
        if (people > seats) {
          const missing = people - seats;
          return `Falta${missing === 1 ? "" : "n"} ${missing} plaza${missing === 1 ? "" : "s"}`;
        }
        const free = seats - people;
        return free ? `${free} plaza${free === 1 ? "" : "s"} libre${free === 1 ? "" : "s"}` : "Plazas cubiertas";
      }

      function displayTrips(trips) {
        const tripsContainer = document.getElementById("tripsContainer");

        while (tripsContainer.firstChild) {
          tripsContainer.removeChild(tripsContainer.firstChild);
        }

        const weekStr = document.getElementById("weekPicker").value;
        const { start, end } = getWeekRange(weekStr);
        const startDate = new Date(start);

        const weekdays = ["Lunes", "Martes", "Miercoles", "Jueves", "Viernes"];
        const groupedTrips = groupTripsByDate(trips);

        const nowDate = getCurrentDateInMadrid();

        for (let i = 0; i < 5; i++) {
          const currentDate = new Date(startDate);
          currentDate.setDate(startDate.getDate() + i);

          const formattedDate = currentDate.toISOString().split("T")[0];
          const dayTrips = groupedTrips[formattedDate] || [];
          const totalSeats = dayTrips.reduce(
            (total, trip) => total + (trip.is_driver ? trip.profiles.seats : 0),
            0
          );
          const dateHeader = document.createElement("h5");
          dateHeader.className = "dateHeader";
          dateHeader.textContent = `📅 ${weekdays[i]} (${formattedDate})${formattedDate === nowDate ? " · Hoy" : ""} · ${dayTrips.length}/${totalSeats} · ${capacityLabel(dayTrips.length, totalSeats)}`;
          dateHeader.title = "Personas reservadas / plazas totales (incluyen al conductor)";
          if (!dayTrips.length) dateHeader.classList.add("emptyDay");
          if (formattedDate === nowDate) {
            dateHeader.classList.add("today");
            dateHeader.setAttribute("aria-current", "date");
          }
          dateHeader.classList.add(
            dayTrips.length > totalSeats
              ? "highlight-driver-needed"
              : "highlight-driver-not-needed"
          );
          let dayContainer = tripsContainer;
          if (formattedDate < nowDate) {
            dayContainer = document.createElement("details");
            dayContainer.className = "pastDay";
            const summary = document.createElement("summary");
            summary.appendChild(dateHeader);
            dayContainer.appendChild(summary);
            tripsContainer.appendChild(dayContainer);
          } else {
            dayContainer.appendChild(dateHeader);
          }

          let isTripAlready = null;
          for (const [company, companyTrips] of groupTripsByCompany(dayTrips)) {
            const seats = companyTrips.reduce(
              (total, trip) => total + (trip.is_driver ? trip.profiles.seats : 0),
              0
            );
            const companyHeader = document.createElement("h6");
            companyHeader.className = "companyHeader";
            companyHeader.textContent = `${company || "Sin empresa"} · ${companyTrips.length}/${seats}`;
            dayContainer.appendChild(companyHeader);
            const tripList = document.createElement("ul");
            companyTrips.forEach((trip) => {
              const tripItem = document.createElement("li");
              tripItem.textContent = `${trip.profiles.first_name}${
                trip.profiles.last_name ? " " + trip.profiles.last_name : ""
              }${trip.is_driver ? "🚗" : "👤"}${
                trip.notes ? `(${trip.notes})` : ""
              }`;

              if (trip.profiles.email === USER.email) {
                tripItem.classList.add("ownTrip");
                tripItem.textContent = `Tú · ${tripItem.textContent}`;
              }

              if (
                trip.profiles.email === USER.email &&
                formattedDate >= nowDate
              ) {
                tripItem.style.fontWeight = "bold";

                const buttons = document.createElement("div");
                buttons.className = "tripActions";

                const notesButton = document.createElement("button");
                notesButton.textContent = "📝";
                notesButton.title = "Editar tus notas";
                notesButton.setAttribute("aria-label", "Editar tus notas");
                notesButton.onclick = () => {
                  showPrompt(trip.notes, (notes) => {
                    addTrip(
                      formattedDate,
                      trip.is_driver,
                      notes == "" ? null : notes
                    );
                  });
                };
                buttons.appendChild(notesButton);

                const removeButton = document.createElement("button");
                removeButton.textContent = "🗑️";
                removeButton.title = "Cancelar tu reserva";
                removeButton.setAttribute("aria-label", "Cancelar tu reserva");
                removeButton.onclick = () => removeTrip(trip.trip_date);
                buttons.appendChild(removeButton);

                tripItem.appendChild(buttons);

                isTripAlready = trip;
              }
              tripList.appendChild(tripItem);
            });

            dayContainer.appendChild(tripList);
          }

          if (formattedDate >= nowDate) {
            const buttonContainer = document.createElement("div");
            buttonContainer.className = "tripActions";

            if (!isTripAlready || (isTripAlready && !isTripAlready.is_driver)) {
              const addDriverButton = document.createElement("button");
              addDriverButton.textContent = "🚗";
              addDriverButton.title = "Reservar como conductor";
              addDriverButton.setAttribute("aria-label", "Reservar como conductor");
              addDriverButton.onclick = () =>
                addTrip(formattedDate, true, isTripAlready?.notes ?? null);
              buttonContainer.appendChild(addDriverButton);
            }

            if (!isTripAlready || (isTripAlready && isTripAlready.is_driver)) {
              const addPassengerButton = document.createElement("button");
              addPassengerButton.textContent = "👤";
              addPassengerButton.title = "Reservar como pasajero";
              addPassengerButton.setAttribute("aria-label", "Reservar como pasajero");
              addPassengerButton.onclick = () =>
                addTrip(formattedDate, false, isTripAlready?.notes ?? null);
              buttonContainer.appendChild(addPassengerButton);
            }

            dateHeader.appendChild(buttonContainer);
            if (dayTrips.length > totalSeats) {
              const rankingLink = document.createElement("a");
              rankingLink.href = "#statsContainer";
              rankingLink.textContent = "Se necesitan conductores · Ver turno ↓";
              dateHeader.appendChild(rankingLink);
            }
          }
        }

      }

      let savingTrip = false;

      async function saveTrip(path, options, successMessage) {
        if (savingTrip) return;
        savingTrip = true;
        clearError();
        const container = document.getElementById("tripsContainer");
        const status = document.getElementById("saveStatus");
        container.inert = true;
        container.setAttribute("aria-busy", "true");
        status.textContent = "Guardando…";
        try {
          const { error } = await supabasecli.functions.invoke(path, options);
          if (error) throw error;
          status.textContent = successMessage;
          await Promise.all([fetchTrips(), fetchTripsStats()]);
        } catch (error) {
          status.textContent = "";
          showError("No se pudo actualizar el plan. Comprueba tu conexión e inténtalo de nuevo.");
        } finally {
          savingTrip = false;
          container.inert = tripsLoading;
          container.setAttribute("aria-busy", "false");
        }
      }

      async function addTrip(trip_date, is_driver, notes) {
        await saveTrip("trips", {
          method: "POST",
          body: { trip_date, is_driver, notes },
        }, `Reserva guardada · ${is_driver ? "Conductor" : "Pasajero"}`);
      }

      async function removeTrip(tripDate) {
        await saveTrip(`trips/${tripDate}`, { method: "DELETE" }, "Reserva cancelada");
      }

      async function checkSession() {
        const { data } = await supabasecli.auth.getSession();
        if (data?.session) {
          USER = data.session.user;
          toggleUI(true);
        }
      }

      async function resetPasswordEmail() {
        const email = document.getElementById("resetEmail").value;

        const { error } = await supabasecli.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + "/update-password",
        });

        if (error) {
          console.error("Reset Password Error:", error.message);
          document.getElementById("resetErrorMsg").textContent = error.message;
        } else {
          document.getElementById("resetErrorMsg").textContent =
            "Check your email for the reset link!";
        }
      }

      async function resetPassword() {
        const newPassword = document.getElementById("newPassword").value;
        const confirmPassword =
          document.getElementById("confirmPassword").value;

        // Validate that both passwords match
        if (newPassword !== confirmPassword) {
          document.getElementById("errorMessage").textContent =
            "Passwords do not match!";
          document.getElementById("errorMessage").style.display = "block";
          return;
        }

        const { data: sessionData, error: sessionError } =
          await supabasecli.auth.setSession({
            access_token: access_token,
            refresh_token: refresh_token,
          });
        if (sessionError) {
          // Handle session error
          document.getElementById("errorMessage").textContent =
            sessionError.message;
          document.getElementById("errorMessage").style.display = "block";
        } else {
          // Update the user's password with Supabase
          const { error } = await supabasecli.auth.updateUser({
            password: newPassword,
          });

          if (error) {
            // Display error message
            document.getElementById("errorMessage").textContent = error.message;
            document.getElementById("errorMessage").style.display = "block";
          } else {
            // Password updated successfully
            document.getElementById("errorMessage").textContent =
              "Your password has been updated successfully!";
            document.getElementById("errorMessage").style.display = "block";
            document.getElementById("resetForm").reset();
          }
        }
      }

      document.getElementById("login").addEventListener("click", login);
      document.getElementById("csv").addEventListener("click", generateCSV);
      document.getElementById("logout").addEventListener("click", logout);
      document
        .getElementById("weekPicker")
        .addEventListener("change", function () {
          clearError();
          document.getElementById("saveStatus").textContent = "";
          fetchTrips();
        });

      document
        .getElementById("forgotPasswordLink")
        .addEventListener("click", function () {
          document.getElementById("loginForm").style.display = "none";
          document.getElementById("resetPasswordForm").style.display = "block";
        });

      document
        .getElementById("resetPasswordBtn")
        .addEventListener("click", resetPasswordEmail);

      document
        .getElementById("cancelResetBtn")
        .addEventListener("click", function () {
          document.getElementById("resetPasswordForm").style.display = "none";
          document.getElementById("loginForm").style.display = "block";
          document.getElementById("resetEmail").value = "";
          document.getElementById("resetErrorMsg").textContent = "";
        });

      document
        .getElementById("resetPasswordButton")
        .addEventListener("click", resetPassword);

      if (window.location.pathname === "/") {
        checkSession();
      }
    </script>
  </body>
</html>
